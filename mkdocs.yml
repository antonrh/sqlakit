site_name: SQLAKit
site_description: "A toolkit for SQLAlchemy applications."
repo_url: https://github.com/antonrh/sqlakit
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.expand
    - navigation.top
    - toc.follow
    - navigation.footer

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - The database: databases.md
  - Context: context.md
  - Queries: queries.md
  - SQL templates: sql.md
  - Models: models.md
  - Multiple databases: routing.md
  - Debugging: debugging.md
  - Testing: testing.md
  - Examples: examples.md
  - Reference: reference.md

extra_css:
  - assets/theme.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
